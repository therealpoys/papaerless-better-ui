name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # pnpm-Version kommt aus "packageManager" in der Root-package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  android-apk:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Capacitor-CLI 8 braucht Node >= 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      # Web bauen, Assets nach Android kopieren, Debug-APK bauen
      - run: pnpm --filter @papaerless/android build:apk

      - uses: actions/upload-artifact@v4
        with:
          name: paperless-better-ui-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
